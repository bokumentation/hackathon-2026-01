<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" height="250" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="250" fill="#ffffff"/>

  <text x="10" y="24" font-size="13" font-weight="700" fill="#374151">Header (96 bit)</text>
  <g fill="#eef2ff" stroke="#3730a3" stroke-width="1.4">
    <rect x="10"  y="34" width="224" height="56" rx="6"/>
    <rect x="234" y="34" width="112" height="56" rx="6"/>
    <rect x="346" y="34" width="112" height="56" rx="6"/>
    <rect x="458" y="34" width="224" height="56" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#111827">
    <text x="122" y="60" font-size="11.5" font-weight="700">preamble</text>
    <text x="122" y="76" font-size="9.5" fill="#374151">32 bit - 0xAAAAAAAA</text>
    <text x="290" y="60" font-size="11.5" font-weight="700">type_1</text>
    <text x="290" y="76" font-size="9.5" fill="#374151">16 bit - 0xD391</text>
    <text x="402" y="60" font-size="11.5" font-weight="700">type_2</text>
    <text x="402" y="76" font-size="9.5" fill="#374151">16 bit - 0xD391</text>
    <text x="570" y="60" font-size="11.5" font-weight="700">constant</text>
    <text x="570" y="76" font-size="9.5" fill="#374151">32 bit - 0x0DFFFFFE</text>
  </g>

  <text x="10" y="126" font-size="13" font-weight="700" fill="#374151">Data (96 bit)</text>
  <g fill="#eef2ff" stroke="#3730a3" stroke-width="1.4">
    <rect x="10"  y="136" width="224" height="56" rx="6"/>
    <rect x="234" y="136" width="112" height="56" rx="6"/>
    <rect x="346" y="136" width="112" height="56" rx="6"/>
    <rect x="458" y="136" width="56" height="56" rx="6"/>
  </g>
  <g fill="#ffedd5" stroke="#c2410c" stroke-width="1.4">
    <rect x="514" y="136" width="56" height="56" rx="6"/>
    <rect x="570" y="136" width="56" height="56" rx="6"/>
    <rect x="626" y="136" width="56" height="56" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#111827">
    <text x="122" y="162" font-size="11.5" font-weight="700">thermostat_id</text>
    <text x="122" y="178" font-size="9.5" fill="#374151">32 bit</text>
    <text x="290" y="162" font-size="11.5" font-weight="700">room_temp</text>
    <text x="290" y="178" font-size="9.5" fill="#374151">16 bit</text>
    <text x="402" y="162" font-size="11.5" font-weight="700">set_temp</text>
    <text x="402" y="178" font-size="9.5" fill="#374151">16 bit</text>
    <text x="486" y="162" font-size="10.5" font-weight="700">state</text>
    <text x="486" y="178" font-size="9" fill="#374151">8 bit</text>
    <text x="542" y="162" font-size="10" font-weight="700" fill="#7c2d12">tail_1</text>
    <text x="542" y="178" font-size="9" fill="#7c2d12">8 bit</text>
    <text x="598" y="162" font-size="10" font-weight="700" fill="#7c2d12">tail_2</text>
    <text x="598" y="178" font-size="9" fill="#7c2d12">8 bit</text>
    <text x="654" y="162" font-size="10" font-weight="700" fill="#7c2d12">tail_3</text>
    <text x="654" y="178" font-size="9" fill="#7c2d12">8 bit</text>
  </g>

  <text x="10" y="220" font-size="10.5" fill="#374151">Total frame 192 bit; hanya 96 bit yang di-buffer pada satu waktu (header atau data).</text>
  <text x="10" y="238" font-size="10.5" fill="#7c2d12">tail_1..3 = field integritas 24 bit (diduga CRC-24, belum divalidasi pada baseline).</text>
</svg>
