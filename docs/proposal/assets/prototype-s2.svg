<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="ar2f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="200" fill="#ffffff"/>
  <text x="20" y="25" font-size="14" font-weight="700" fill="#7c2d12">S2 - Wired hardware-in-the-loop (regression / demo)</text>

  <!-- fault injection -->
  <rect x="230" y="44" width="200" height="48" rx="9" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="330" y="64" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7f1d1d">fault injection</text>
  <text x="330" y="80" text-anchor="middle" font-size="9.5" fill="#7f1d1d">single-bit flip in replay buffer</text>
  <g stroke="#b91c1c" stroke-width="1.6" marker-end="url(#ar2f)" fill="none">
    <line x1="330" y1="92" x2="330" y2="116"/>
  </g>

  <!-- row -->
  <g fill="#eef2ff" stroke="#3730a3" stroke-width="1.6">
    <rect x="20"  y="118" width="160" height="64" rx="9"/>
    <rect x="230" y="118" width="200" height="64" rx="9"/>
    <rect x="740" y="118" width="210" height="64" rx="9"/>
  </g>
  <g fill="#dcfce7" stroke="#166534" stroke-width="1.6">
    <rect x="470" y="118" width="230" height="64" rx="9"/>
  </g>

  <g text-anchor="middle" fill="#111827">
    <text x="100" y="145" font-size="12.5" font-weight="700">CSV captures</text>
    <text x="100" y="162" font-size="10" fill="#374151">replay source</text>

    <text x="330" y="145" font-size="12.5" font-weight="700">ESP32 replay (RMT)</text>
    <text x="330" y="162" font-size="10" fill="#374151">real-time waveform</text>

    <text x="585" y="142" font-size="12.5" font-weight="700">DE10-Nano (Cyclone V)</text>
    <text x="585" y="159" font-size="10.5" fill="#166534">decoder + SALARAS</text>

    <text x="845" y="145" font-size="12.5" font-weight="700">Host PC / laptop</text>
    <text x="845" y="162" font-size="10" fill="#374151">USB-UART: full, fault, uo_out</text>
  </g>

  <g stroke="#1f2937" stroke-width="1.8" marker-end="url(#ar2)" fill="none">
    <line x1="180" y1="150" x2="228" y2="150"/>
    <line x1="430" y1="150" x2="468" y2="150"/>
    <line x1="700" y1="150" x2="738" y2="150"/>
  </g>
  <text x="449" y="142" text-anchor="middle" font-size="9.5" fill="#374151">3.3 V wire</text>
  <text x="719" y="142" text-anchor="middle" font-size="9.5" fill="#374151">UART</text>
</svg>
