<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="260" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="700" fill="#111827">Frame: counter (32) + payload (64) + tag (32) = 128 bit</text>

  <!-- frame row -->
  <rect x="30" y="50" width="130" height="46" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <rect x="160" y="50" width="260" height="46" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <rect x="420" y="50" width="130" height="46" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>

  <text x="95" y="78" font-size="13" text-anchor="middle" fill="#0c4a6e">counter (32)</text>
  <text x="290" y="78" font-size="13" text-anchor="middle" fill="#0c4a6e">payload (64)</text>
  <text x="485" y="78" font-size="13" text-anchor="middle" fill="#7f1d1d">tag (32)</text>

  <!-- authenticated span: counter + payload only (96 bit) -->
  <line x1="30" y1="112" x2="420" y2="112" stroke="#0369a1" stroke-width="2"/>
  <line x1="30" y1="106" x2="30" y2="118" stroke="#0369a1" stroke-width="2"/>
  <line x1="420" y1="106" x2="420" y2="118" stroke="#0369a1" stroke-width="2"/>
  <text x="225" y="132" font-size="13" text-anchor="middle" fill="#0c4a6e">authenticated by CBC-MAC: 96 bit = three 32-bit blocks</text>

  <!-- tag is the MAC output, compared against the received tag -->
  <text x="600" y="132" font-size="11" fill="#7f1d1d">tag = MAC output, compared</text>

  <!-- MAC chain -->
  <text x="20" y="176" font-size="14" font-weight="700" fill="#111827">CBC-MAC (SIMON-32/64, one round per cycle)</text>
  <rect x="30" y="188" width="90" height="34" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="75" y="210" font-size="12" text-anchor="middle">E_K(IV ^ B1)</text>
  <text x="128" y="210" font-size="13">&#8594;</text>
  <rect x="145" y="188" width="90" height="34" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="190" y="210" font-size="12" text-anchor="middle">E_K(C1 ^ B2)</text>
  <text x="243" y="210" font-size="13">&#8594;</text>
  <rect x="260" y="188" width="90" height="34" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="305" y="210" font-size="12" text-anchor="middle">E_K(C2 ^ B3)</text>
  <text x="358" y="210" font-size="13">&#8594;</text>
  <rect x="375" y="188" width="110" height="34" fill="#fef9c3" stroke="#a16207" stroke-width="1.2"/>
  <text x="430" y="210" font-size="12" text-anchor="middle">tag = C3 (32 bit)</text>

  <text x="20" y="250" font-size="11" fill="#64748b">IV = 0, B1 = counter, B2-B3 = payload. The 64-bit key is loaded separately and is not part of the frame.</text>
</svg>
