    <marker
       style="overflow:visible"
       id="Stop"
       refX="0"
       refY="0"
       orient="auto"
       inkscape:stockid="Stop"
       markerWidth="1"
       markerHeight="1"
       viewBox="0 0 1 1"
       inkscape:isstock="true"
       inkscape:collect="always"
       preserveAspectRatio="xMidYMid">
      <path
         style="fill:none;stroke:context-stroke;stroke-width:1"
         d="M 0,4 V -4"
         id="path23" />
    </marker>
  </defs>
  <sodipodi:namedview
     id="namedview18"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1.7842105"
     inkscape:cx="347.49263"
     inkscape:cy="132.83186"
     inkscape:window-width="1920"
     inkscape:window-height="1011"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg18" />
  <rect
     x="0"
     y="0"
     width="598.30408"
     height="260"
     fill="#ffffff"
     id="rect1"
     style="stroke-width:0.887267" />
  <text
     x="20"
     y="28"
     font-size="15px"
     font-weight="700"
     fill="#111827"
     id="text1">Frame: counter (32) + payload (64) + tag (32) = 128 bit</text>
  <!-- frame row -->
  <rect
     x="30"
     y="50"
     width="130"
     height="46"
     fill="#e0f2fe"
     stroke="#0369a1"
     stroke-width="1.5"
     id="rect2" />
  <rect
     x="160"
     y="50"
     width="260"
     height="46"
     fill="#e0f2fe"
     stroke="#0369a1"
     stroke-width="1.5"
     id="rect3" />
  <rect
     x="420"
     y="50"
     width="130"
     height="46"
     fill="#fee2e2"
     stroke="#b91c1c"
     stroke-width="1.5"
     id="rect4" />
  <text
     x="95"
     y="78"
     font-size="13px"
     text-anchor="middle"
     fill="#0c4a6e"
     id="text4">counter (32)</text>
  <text
     x="290"
     y="78"
     font-size="13px"
     text-anchor="middle"
     fill="#0c4a6e"
     id="text5">payload (64)</text>
  <text
     x="485"
     y="78"
     font-size="13px"
     text-anchor="middle"
     fill="#7f1d1d"
     id="text6">tag (32)</text>
  <!-- authenticated span: counter + payload only (96 bit) -->
  <line
     x1="30"
     y1="112"
     x2="420"
     y2="112"
     stroke="#0369a1"
     stroke-width="2"
     id="line6" />
  <line
     x1="30"
     y1="106"
     x2="30"
     y2="118"
     stroke="#0369a1"
     stroke-width="2"
     id="line7" />
  <line
     x1="420"
     y1="106"
     x2="420"
     y2="118"
     stroke="#0369a1"
     stroke-width="2"
     id="line8" />
  <text
     x="225"
     y="132"
     font-size="13px"
     text-anchor="middle"
     fill="#0c4a6e"
     id="text8">authenticated by CBC-MAC: 96 bit = three 32-bit blocks</text>
  <!-- tag is the MAC output, compared against the received tag -->
  <text
     x="425.41299"
     y="131.43951"
     font-size="11px"
     fill="#7f1d1d"
     id="text9">tag = MAC output, compared</text>
  <!-- MAC chain -->
  <text
     x="20"
     y="176"
     font-size="14px"
     font-weight="700"
     fill="#111827"
     id="text10">CBC-MAC (SIMON-32/64, one round per cycle)</text>
  <rect
     x="30"
     y="188"
     width="90"
     height="34"
     fill="#ffffff"
     stroke="#334155"
     stroke-width="1.2"
     id="rect10" />
  <text
     x="75"
     y="210"
     font-size="12px"
     text-anchor="middle"
     id="text11">E_K(IV ^ B1)</text>
  <text
     x="128"
     y="210"
     font-size="13px"
     id="text12">→</text>
  <rect
     x="145"
     y="188"
     width="90"
     height="34"
     fill="#ffffff"
     stroke="#334155"
     stroke-width="1.2"
     id="rect12" />
  <text
     x="190"
     y="210"
     font-size="12px"
     text-anchor="middle"
     id="text13">E_K(C1 ^ B2)</text>
  <text
     x="243"
     y="210"
     font-size="13px"
     id="text14">→</text>
  <rect
     x="260"
     y="188"
     width="90"
     height="34"
     fill="#ffffff"
     stroke="#334155"
     stroke-width="1.2"
     id="rect14" />
  <text
     x="305"
     y="210"
     font-size="12px"
     text-anchor="middle"
     id="text15">E_K(C2 ^ B3)</text>
  <text
     x="358"
     y="210"
     font-size="13px"
     id="text16">→</text>
  <rect
     x="375"
     y="188"
     width="110"
     height="34"
     fill="#fef9c3"
     stroke="#a16207"
     stroke-width="1.2"
     id="rect16" />
  <text
     x="430"
     y="210"
     font-size="12px"
     text-anchor="middle"
     id="text17">tag = C3 (32 bit)</text>
  <text
     x="20"
     y="250"
     font-size="11px"
     fill="#64748b"
     id="text18">IV = 0, B1 = counter, B2-B3 = payload. The 64-bit key is loaded separately and is not part of the frame.</text>
  <path
     style="fill:none;fill-rule:evenodd;stroke:#b91c1c;stroke-width:1.5;stroke-linecap:butt;stroke-linejoin:miter;stroke-dasharray:none;stroke-opacity:1;marker-start:url(#Stop);marker-end:url(#marker19)"
     d="m 422.80253,112.37441 121.97974,-0.27979"
     id="path18"
     inkscape:connector-type="polyline"
     inkscape:connector-curvature="0" />
</svg>
