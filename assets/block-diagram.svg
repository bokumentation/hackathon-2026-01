<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="540" fill="#ffffff"/>

  <!-- title -->
  <text x="450" y="30" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">TRI-ARGA — only authenticated and fresh frames reach the host</text>

  <!-- trust boundary dashed line -->
  <text x="310" y="55" font-size="11" fill="#94a3b8" text-anchor="middle">trust boundary</text>
  <line x1="310" y1="62" x2="310" y2="480" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- untrusted label -->
  <text x="155" y="80" font-size="11" fill="#94a3b8" text-anchor="middle">Untrusted</text>

  <!-- trusted label -->
  <text x="810" y="80" font-size="11" fill="#94a3b8" text-anchor="middle">Trusted</text>

  <!-- ===== FRONT-END box (left) ===== -->
  <rect x="40" y="95" width="170" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="125" y="120" font-size="13" font-weight="700" text-anchor="middle" fill="#1e293b">Front-end</text>
  <text x="125" y="140" font-size="11" text-anchor="middle" fill="#475569">TT07 SerDes</text>
  <text x="125" y="156" font-size="11" text-anchor="middle" fill="#475569">Manchester / RF</text>
  <text x="125" y="172" font-size="11" text-anchor="middle" fill="#475569">UART</text>

  <!-- ===== ATTACKER box (red, bottom-left) ===== -->
  <rect x="40" y="310" width="170" height="90" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="125" y="338" font-size="13" font-weight="700" text-anchor="middle" fill="#7f1d1d">Attacker</text>
  <text x="125" y="357" font-size="11" text-anchor="middle" fill="#991b1b">insert, modify, delete,</text>
  <text x="125" y="373" font-size="11" text-anchor="middle" fill="#991b1b">replay frames</text>

  <!-- arrow attacker → front-end (red, upward) -->
  <line x1="125" y1="310" x2="125" y2="207" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- ===== TRI-ARGA CORE outer box ===== -->
  <rect x="330" y="70" width="330" height="410" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="495" y="97" font-size="12" font-weight="700" text-anchor="middle" fill="#334155">TRI-ARGA core: single clock, no block RAM</text>

  <!-- L1 Frame loader -->
  <rect x="355" y="112" width="280" height="80" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="495" y="140" font-size="13" font-weight="700" text-anchor="middle" fill="#1e293b">L1 — Frame loader</text>
  <text x="495" y="159" font-size="11" text-anchor="middle" fill="#475569">counter 32 + payload 64 + tag 32</text>
  <text x="495" y="175" font-size="11" text-anchor="middle" fill="#475569">l1_serial_loader · write-once key lock</text>

  <!-- arrow L1 → L2 -->
  <line x1="495" y1="192" x2="495" y2="222" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- L2 Auth -->
  <rect x="355" y="222" width="280" height="90" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="495" y="250" font-size="13" font-weight="700" text-anchor="middle" fill="#1e293b">L2 — Auth</text>
  <text x="495" y="269" font-size="11" text-anchor="middle" fill="#475569">SIMON-32/64 CBC-MAC, tag check</text>
  <text x="495" y="285" font-size="11" text-anchor="middle" fill="#475569">counter must increase strictly</text>
  <text x="495" y="301" font-size="11" text-anchor="middle" fill="#475569">auth_ok, fresh_ok</text>

  <!-- arrow label -->
  <text x="515" y="328" font-size="10" fill="#64748b">auth_ok, fresh_ok</text>
  <!-- arrow L2 → L3 -->
  <line x1="495" y1="312" x2="495" y2="345" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- L3 Commit -->
  <rect x="355" y="345" width="280" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="495" y="372" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">L3 — Commit (fail-closed)</text>
  <text x="495" y="391" font-size="11" text-anchor="middle" fill="#1e40af">data + host_full released atomically</text>
  <text x="495" y="407" font-size="11" text-anchor="middle" fill="#1e40af">on fail: sticky fault, data withheld</text>
  <text x="495" y="423" font-size="11" text-anchor="middle" fill="#1e40af">l3_commit_gatekeeper</text>

  <!-- ===== HOST box (right) ===== -->
  <rect x="740" y="185" width="140" height="160" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="810" y="212" font-size="13" font-weight="700" text-anchor="middle" fill="#1e293b">Host</text>
  <text x="810" y="232" font-size="11" text-anchor="middle" fill="#475569">loads session key</text>
  <text x="810" y="250" font-size="11" text-anchor="middle" fill="#475569">reads data</text>
  <text x="810" y="268" font-size="11" text-anchor="middle" fill="#475569">ack fault</text>

  <!-- arrow front-end → L1 (frame in) -->
  <line x1="210" y1="150" x2="353" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- key arrow Host → L2 -->
  <line x1="738" y1="235" x2="637" y2="260" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="690" y="240" font-size="10" fill="#64748b" text-anchor="middle">key</text>

  <!-- arrow L3 → Host: data, full -->
  <line x1="635" y1="370" x2="738" y2="295" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="690" y="330" font-size="10" fill="#64748b" text-anchor="middle">data, full</text>

  <!-- arrow L3 → Host: fault -->
  <line x1="635" y1="415" x2="738" y2="345" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="690" y="408" font-size="10" fill="#64748b" text-anchor="middle">fault</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#475569"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#b91c1c"/>
    </marker>
  </defs>
</svg>
