<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="300" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="700" fill="#111827">Authenticated ingress boundary (Tier A, single clock)</text>

  <!-- frame in -->
  <rect x="20" y="70" width="140" height="70" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="90" y="100" font-size="12" text-anchor="middle" fill="#0c4a6e">frame in</text>
  <text x="90" y="118" font-size="11" text-anchor="middle" fill="#0c4a6e">counter + payload</text>
  <text x="90" y="132" font-size="11" text-anchor="middle" fill="#0c4a6e">+ tag</text>

  <!-- L2 -->
  <rect x="220" y="60" width="220" height="90" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="330" y="86" font-size="13" font-weight="700" text-anchor="middle" fill="#312e81">L2 auth</text>
  <text x="330" y="106" font-size="11" text-anchor="middle" fill="#312e81">SIMON-32/64 CBC-MAC</text>
  <text x="330" y="122" font-size="11" text-anchor="middle" fill="#312e81">counter freshness</text>
  <text x="330" y="140" font-size="11" text-anchor="middle" fill="#312e81">auth_ok, fresh_ok</text>

  <!-- L3 -->
  <rect x="500" y="60" width="180" height="90" rx="6" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="590" y="86" font-size="13" font-weight="700" text-anchor="middle" fill="#713f12">L3 commit</text>
  <text x="590" y="106" font-size="11" text-anchor="middle" fill="#713f12">atomic, fail-closed</text>
  <text x="590" y="122" font-size="11" text-anchor="middle" fill="#713f12">host_full, fault</text>

  <!-- host -->
  <rect x="710" y="70" width="90" height="70" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="755" y="110" font-size="12" text-anchor="middle" fill="#334155">host</text>

  <!-- arrows -->
  <line x1="160" y1="105" x2="220" y2="105" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="440" y1="105" x2="500" y2="105" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="680" y1="105" x2="710" y2="105" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- key -->
  <rect x="220" y="190" width="160" height="44" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="300" y="217" font-size="12" text-anchor="middle" fill="#7f1d1d">key (64, host-loaded)</text>
  <line x1="300" y1="190" x2="300" y2="150" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- fault -->
  <text x="500" y="200" font-size="11" fill="#b91c1c">fault sticky until acknowledged</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="20" y="275" font-size="11" fill="#64748b">No buffer, no block RAM. host_full is asserted only when auth_ok and fresh_ok are both high at frame end.</text>
</svg>
